<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock_paper_scissors</title>
</head>
<body>
    <h2>
        rock paper scissors
    </h2>
    
    <button onclick="

    PlayerMove('rock');
    ">rock</button>

    <button onclick="
    PlayerMove('paper');
    ">paper</button>

    <button onclick = "
    PlayerMove('scissors');
    ">scissors</button>
    
   <script>
    function PlayerMove(move){
    const ComputerChoice=PickNumber();
    let result = '';
    if(move === 'scissors'){
        if(ComputerChoice === 'rock'){
        result = 'lose';
    }
    else if(ComputerChoice === 'paper'){
        result = 'win';
    }
    else if(ComputerChoice === 'scissors'){
        result = 'Tie';
    }
    
    }
    else if(move==='paper'){
        if(ComputerChoice === 'rock'){
        result = 'WIn';
    }
    else if(ComputerChoice === 'paper'){
        result = 'Tie';
    }
    else if(ComputerChoice === 'scissors'){
        result = 'lose';
    }
  
    }
    else if(move==='rock'){
        if(ComputerChoice === 'rock'){
        result = 'tie';
    }
    else if(ComputerChoice === 'paper'){
        result = 'lose';
    }
    else if(ComputerChoice === 'scissors'){
        result = 'Win';
    }
    
    }
    alert(`You picked ${move}. Computer picked ${ComputerChoice}. ${result}.`);
    }
    function PickNumber(){
    let random_number = Math.random();
    let ComputerChoice ='';
    if(random_number >= 0 && random_number <1/3){
        ComputerChoice ='rock';
    }
    else if(random_number >= 1/3 && random_number <2/3){
        ComputerChoice ='paper';
    }
    else if(random_number >= 2/3 && random_number <1){
        ComputerChoice ='scissors';
    }
    return ComputerChoice;
    }  
   </script>
</body>
</html>
