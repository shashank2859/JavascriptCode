<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h2>Youtube Subscribe Button</h2>
    <button class="sub" onclick="
    subscribe();
    ">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
     
    <input placeholder="enter the cost" class="js-input"  onkeydown="
    console.log(event.key)
    if(event.key==='Enter'){
        calculate(event);
    }">
    <button class="js-calculate" onclick="
        calculate();">Calculate</button>
    <p class="js-totalcost"></p>
   <script>
    function EventEnter(event)
        {console.log(event.key)
            if(event.key==='Enter'){
                calculate();
            }}

    function calculate(){
        const inputElement=document.querySelector('.js-input');
        let cost=Number(inputElement.value);
        if(cost<40){
            cost=cost+10;
        }
        document.querySelector('.js-totalcost').innerHTML=`$${cost}`;

    }
    function subscribe(){
        const buttonElement=document.querySelector('button');
            if(buttonElement.innerText === 'Subscribe'){
                buttonElement.innerHTML='Subscribed';
            }
            else{
                buttonElement.innerHTML='Subscribe';
            }
            };
   </script>
</body>
</html>
