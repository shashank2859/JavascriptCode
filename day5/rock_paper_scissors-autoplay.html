<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock_paper_scissors</title>
    <link rel="stylesheet" href="styles/rock-paper-scissors.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    
    <button onclick="
    PlayerMove('rock');
    " class="move-button"><img src="images/rock-emoji.png" class="move-icon"></button>

    <button onclick="
    PlayerMove('paper');
    "class="move-button"><img src="images/paper-emoji.png" class="move-icon"></button>

    <button onclick = "
    PlayerMove('scissors');
    "class="move-button"><img src="images/scissors-emoji.png" class="move-icon"></button>

    <p class="js-result css-result"></p>
    <p class="js-move"></p>
    <p class="js-score score"></p>


    <button onclick="
    score.win=0;
    score.lose=0;
    score.tie=0;
    localStorage.removeItem('score');
    updatescore();
    "
    class="reset">Reset Score</button>
    <button class="css-autoplay" 
    onclick="autoplay();">Auto Play</button>

   <script src="js/rock-paper-scissors.js"></script>
</body>
</html>
