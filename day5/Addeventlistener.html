<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <button class="js-click"> CLICK</button>
   <script>
        const buttonclick=document.querySelector('.js-click');
         const func=()=>{
            console.log('addeventlistener instead of click');
         }
         buttonclick.addEventListener('click',func);
         buttonclick.addEventListener('click',()=>{
            console.log('second time');
         });
         buttonclick.removeEventListener('click',func);
        
   </script>
</body>
</html>
